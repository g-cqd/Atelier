name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (Swift ${{ matrix.swift }})
    # `Package.swift` declares `swift-tools-version: 6.2` and
    # `.macOS(.v26)`. macos-15 is the closest GitHub runner image with a
    # Swift 6.2 toolchain available via `swift-actions/setup-swift`. The
    # 6.2 toolchain is also a soft prerequisite for the `swift-format`
    # plugin and the `Synchronization.Mutex` API used throughout the
    # codebase. (Linux job dropped — Swift 6.2 Linux Docker images lag
    # macOS, and the project targets macOS only.)
    runs-on: macos-15
    strategy:
      matrix:
        swift: ["6.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (release)
        run: swift build -c release

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: swift-format
        # `swift-format` is bundled with the toolchain in 6.0+; `--mode lint`
        # exits non-zero on formatting drift without modifying files.
        run: swift-format lint --recursive --configuration .swift-format Sources Tests
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint-ci.yml --strict
