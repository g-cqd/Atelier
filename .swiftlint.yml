included:
  - Package.swift
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm

allow_zero_lintable_files: false
reporter: xcode

disabled_rules:
  - trailing_comma

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - modifier_order
  - redundant_nil_coalescing
  - toggle_bool

analyzer_rules:
  - unused_import
