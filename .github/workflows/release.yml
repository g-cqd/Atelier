name: Release

# Triggered on every `vX.Y.Z` tag push. Builds a universal binary,
# optionally codesigns + notarizes if the relevant secrets are
# configured, packages it as a zip, and attaches it to a GitHub
# release. Without signing secrets the workflow still produces a
# usable binary — Gatekeeper will require explicit allow on first
# run, but the artifact itself is valid. Audit D9.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed for `gh release create`

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Inject release version
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip the leading `v` so `KittyCode 0.2.0` not `KittyCode v0.2.0`.
          VERSION_NUMBER="${VERSION#v}"
          cat > Sources/KittyEditor/Version.swift <<EOF
          // Generated by .github/workflows/release.yml from tag $VERSION.
          // Do not commit changes to this file; the release workflow
          // overwrites it on every tagged build.
          public enum BuildVersion {
              public static let release = "$VERSION_NUMBER"
          }
          EOF
          echo "Injected version: $VERSION_NUMBER"

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Locate binary
        id: locate
        run: |
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          BIN="$BIN_DIR/KittyCode"
          test -x "$BIN" || { echo "binary missing at $BIN"; exit 1; }
          echo "binary=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"
          lipo -info "$BIN"

      - name: Codesign (skipped if SIGNING_IDENTITY secret is unset)
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        if: env.SIGNING_IDENTITY != ''
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "${{ steps.locate.outputs.binary }}"
          codesign --verify --strict --verbose=2 "${{ steps.locate.outputs.binary }}"

      - name: Package zip
        id: package
        run: |
          VERSION="${{ github.ref_name }}"
          ZIP_NAME="kittycode-${VERSION}-macos-universal.zip"
          ZIP="$RUNNER_TEMP/$ZIP_NAME"
          # `ditto -c -k --keepParent` is what `xcrun notarytool` accepts.
          ditto -c -k --keepParent "${{ steps.locate.outputs.binary }}" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP_NAME ($SHA)"

      - name: Notarize (skipped if NOTARY_APPLE_ID secret is unset)
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        if: env.NOTARY_APPLE_ID != ''
        run: |
          xcrun notarytool submit "${{ steps.package.outputs.zip }}" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          # Stapling on bare executables isn't supported; Gatekeeper
          # verifies notarization online on first run.

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--generate-notes` produces a "What's Changed" section by
          # diffing commit titles since the previous tag. Override by
          # editing the release on GitHub afterwards if you want a
          # hand-written changelog.
          gh release create "${{ github.ref_name }}" \
            "${{ steps.package.outputs.zip }}" \
            --title "KittyCode ${{ github.ref_name }}" \
            --generate-notes

      - name: Summary
        run: |
          {
            echo "## KittyCode ${{ github.ref_name }}"
            echo ""
            echo "- Binary: \`${{ steps.package.outputs.zip_name }}\`"
            echo "- SHA-256: \`${{ steps.package.outputs.sha256 }}\`"
            echo "- Architectures: arm64 + x86_64 (universal)"
            echo ""
            echo "### Homebrew formula snippet"
            echo "\`\`\`ruby"
            echo "url \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip_name }}\""
            echo "sha256 \"${{ steps.package.outputs.sha256 }}\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
