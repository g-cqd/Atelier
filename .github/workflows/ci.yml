name: CI

# One call of the family's pinned swift-ci workflow per package (`package-path`), each configured by its own
# `.ci/action.json` (https://github.com/g-cqd/swift-ci); `.ci/swift-ci local` in a package runs the same checks. A change
# under Packages/ checks every package (the apps depend on AtelierCore); a change under one app checks that app.
# Scheduled, manual and merge-queue runs check everything.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Plan · Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      gitdiffviewer: ${{ steps.filter.outputs.gitdiffviewer }}
      kittycode: ${{ steps.filter.outputs.kittycode }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Plan · Classify Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            core:
              - 'Packages/**'
              - '.github/**'
            gitdiffviewer:
              - 'Packages/**'
              - 'Apps/GitDiffViewer/**'
              - '.github/**'
            kittycode:
              - 'Packages/**'
              - 'Apps/KittyCode/**'
              - '.github/**'

  core:
    name: AtelierCore
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || contains(fromJSON('["schedule", "workflow_dispatch", "merge_group"]'), github.event_name) }}
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@1b272203f7a8b89b0faf66bdab4aef5365a68b88 # swift-ci 1b27220
    permissions:
      contents: write # reusable publish permission; this package publishes no archives
    with:
      package-path: Packages/AtelierCore

  gitdiffviewer:
    name: GitDiffViewer
    needs: changes
    if: ${{ needs.changes.outputs.gitdiffviewer == 'true' || contains(fromJSON('["schedule", "workflow_dispatch", "merge_group"]'), github.event_name) }}
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@1b272203f7a8b89b0faf66bdab4aef5365a68b88 # swift-ci 1b27220
    permissions:
      contents: write # reusable publish permission; this package publishes no archives
    with:
      package-path: Apps/GitDiffViewer

  kittycode:
    name: KittyCode
    needs: changes
    if: ${{ needs.changes.outputs.kittycode == 'true' || contains(fromJSON('["schedule", "workflow_dispatch", "merge_group"]'), github.event_name) }}
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@1b272203f7a8b89b0faf66bdab4aef5365a68b88 # swift-ci 1b27220
    permissions:
      contents: write # reusable publish permission; KittyCode releases through kittycode-release.yml
    with:
      package-path: Apps/KittyCode
