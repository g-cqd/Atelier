# Thin caller of the family's single CI definition (format gate, manifest drift, metrics, build,
# test, coverage). Everything package-specific lives in the inputs. macOS only: the app links AppKit,
# TextKit 2 and CryptoKit, so the Linux legs are switched off.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Aemi-Studio/aemi/.github/workflows/swift-quality.yml@main
    with:
      dev-env-var: GDV_DEV
      enable-linux: false
      enable-coverage: true
