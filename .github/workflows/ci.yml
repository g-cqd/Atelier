# One caller of aemi's reusable quality workflow per package. Each job runs from its package directory
# (`package-path`); a change under Packages/ rebuilds every consumer, a change under one app rebuilds that app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      gitdiffviewer: ${{ steps.filter.outputs.gitdiffviewer }}
      kittycode: ${{ steps.filter.outputs.kittycode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            core:
              - 'Packages/**'
              - '.github/**'
            gitdiffviewer:
              - 'Packages/**'
              - 'Apps/GitDiffViewer/**'
              - '.github/**'
            kittycode:
              - 'Packages/**'
              - 'Apps/KittyCode/**'
              - '.github/**'

  gitdiffviewer:
    needs: changes
    if: ${{ needs.changes.outputs.gitdiffviewer == 'true' }}
    uses: Aemi-Studio/aemi/.github/workflows/swift-quality.yml@main
    with:
      package-path: Apps/GitDiffViewer
      dev-env-var: ATELIER_DEV
      enable-linux: false

  kittycode:
    needs: changes
    if: ${{ needs.changes.outputs.kittycode == 'true' }}
    uses: Aemi-Studio/aemi/.github/workflows/swift-quality.yml@main
    with:
      package-path: Apps/KittyCode
      dev-env-var: ATELIER_DEV
      enable-linux: false
